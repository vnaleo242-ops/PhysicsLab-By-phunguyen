<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khảo sát Nguồn điện & Mạch kín | PHYSICS.LAB</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <!-- React & Babel for zero-build JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/global.css">

    <style>
        :root {
            --lab-accent: #00f2ff;
            --lab-bg: #0f172a;
            --lab-panel: rgba(30, 41, 59, 0.7);
        }

        body {
            background-color: var(--lab-bg);
            color: #f8fafc;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: var(--lab-panel);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .font-tech { font-family: 'Orbitron', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--lab-accent);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 15px var(--lab-accent);
            border: 2px solid white;
        }

        .neon-text {
            text-shadow: 0 0 10px var(--lab-accent), 0 0 20px rgba(0, 242, 255, 0.3);
        }

        /* p5.js canvas container */
        #circuit-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* ECharts container */
        #chart-container {
            width: 100%;
            height: 100%;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.1); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Animations */
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); border-color: rgba(239, 68, 68, 0.8); }
            50% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.8); border-color: rgba(239, 68, 68, 1); }
        }
        .short-circuit-alert {
            animation: pulse-red 0.5s infinite;
        }
    </style>
</head>

<body class="dark overflow-hidden h-screen w-screen relative">
    
    <!-- Main Application Mounting Point -->
    <div id="root" class="w-full h-full"></div>

    <!-- Scripts -->
    <script src="js/theme.js"></script>
    <script type="text/babel" src="js/sim-nguon-dien.js"></script>

    <script>
        // Lucide icon initialization helper
        window.addEventListener('DOMContentLoaded', () => {
             if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
</body>

</html>
